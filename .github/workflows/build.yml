name: Build RiseYT

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'Tweak.x'
      - 'Tweak.xm'
      - 'Makefile'
      - 'headers/**'
      - 'RiseYT.plist'
      - 'control'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Verify complete source exists
        run: |
          if [ ! -f Tweak.x ]; then
            echo "::error file=Tweak.x::Missing the implementation source Tweak.x. Headers alone cannot produce RiseYT.dylib."
            exit 1
          fi

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git make clang build-essential fakeroot rsync perl zip unzip libxml2

      - name: Install Theos and iOS SDK
        uses: Randomblock1/theos-action@v1

      - name: Compile tweak
        run: |
          make clean
          make -j2 FINALPACKAGE=1
          mkdir -p output
          dylib="$(find .theos/obj -type f -name RiseYT.dylib -print -quit)"
          if [ -z "$dylib" ]; then
            echo "::error::Build did not produce RiseYT.dylib"
            exit 1
          fi
          cp "$dylib" output/RiseYT.dylib
          file output/RiseYT.dylib

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: RiseYT-dylib
          path: output/RiseYT.dylib
          if-no-files-found: error
