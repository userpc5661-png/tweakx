name: Build Beegram Tweak

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      THEOS: /opt/theos
      THEOS_DEVICE_IP: ""
      THEOS_DEVICE_PORT: 22

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            build-essential \
            cmake \
            git \
            curl \
            wget \
            unzip \
            xz-utils \
            fakeroot \
            dpkg \
            ldid \
            libxml2 \
            libz-dev \
            clang \
            lld \
            llvm

      - name: Cache Theos
        uses: actions/cache@v4
        id: theos-cache
        with:
          path: /opt/theos
          key: theos-${{ runner.os }}-${{ hashFiles('.github/workflows/build.yml') }}

      - name: Install Theos
        if: steps.theos-cache.outputs.cache-hit != 'true'
        run: |
          git clone --recursive https://github.com/theos/theos.git /opt/theos

      - name: Cache iOS SDKs
        uses: actions/cache@v4
        id: sdk-cache
        with:
          path: /opt/theos/sdks
          key: theos-sdks-iphone-14.0

      - name: Download iOS 16.5 SDK
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p /opt/theos/sdks
          wget -q "https://github.com/theos/sdks/releases/download/main/iPhoneOS16.5.sdk.tar.xz" -O /tmp/sdk.tar.xz
          tar -xJf /tmp/sdk.tar.xz -C /opt/theos/sdks
          rm /tmp/sdk.tar.xz

      - name: Setup Theos env
        run: |
          echo "THEOS=/opt/theos" >> $GITHUB_ENV
          echo "/opt/theos/bin" >> $GITHUB_PATH

          # Install ldid for codesigning stubs
          if ! command -v ldid &> /dev/null; then
            wget -q "https://github.com/ProcursusTeam/ldid/releases/latest/download/ldid_linux_x86_64" -O /usr/local/bin/ldid
            chmod +x /usr/local/bin/ldid
          fi

      - name: Verify Theos setup
        run: |
          ls /opt/theos/
          ls /opt/theos/sdks/ || echo "No SDKs found"
          $THEOS/bin/nic.pl --version || echo "NIC available"

      - name: Build Beegram
        run: |
          cd $GITHUB_WORKSPACE
          export THEOS=/opt/theos
          export TARGET="iphone:clang:16.5:14.0"
          export ARCHS="arm64 arm64e"
          make package FINALPACKAGE=1 DEBUG=0

      - name: List build output
        run: |
          ls -la packages/ || echo "No packages directory"
          find . -name "*.deb" 2>/dev/null || echo "No .deb found"

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: Beegram-deb
          path: packages/*.deb
          if-no-files-found: warn
          retention-days: 30

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            .theos/
            *.log
          retention-days: 7
